schema_version: 1
display_name: Moment Notes
short_description: Warm Chinese handwritten emotional notes over original photos.
default_prompt: For every uploaded image, generate the annotated image first by editing the uploaded image itself. Use the V6.3 node workflow: photo diagnosis -> annotation strategy -> prompt assembly -> single generation -> QA reflection -> issue meta when requested. Read photo-diagnosis.md, annotation-patterns.md, style-dna.md, and prompt-template.md before generation; read qa-checklist.md and bad-cases.md after generation; read issue-report-template.md only when the user says "report to issue:". Keep internal meta for emotional line, relationship summary, subject mode, object groups, low-priority props, annotation density, structural marks, readability strategy, QA failures, and retry decision. Preserve the original filter, color mood, composition, object positions, crop ratio, and visual character. Generate exactly one edited result per input image by default, process multiple images separately, and retry at most once only for serious QA failure. Never merge images, redraw the photo, or copy example composition/text unless explicitly requested.
